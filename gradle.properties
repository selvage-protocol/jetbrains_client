org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:-UsePerfData
org.gradle.workers.max=4
org.gradle.caching=true
kotlin.code.style=official
# Compile inside the Gradle daemon: no separate Kotlin daemon, and nothing of it in the system
# temporary directory.
kotlin.compiler.execution.strategy=in-process
