name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The ktlint release the flake's nixpkgs carries, so a developer and the runner lint with
      # the same rules. The checksum is of the release's own `ktlint` asset.
      KTLINT_VERSION: "1.8.0"
      KTLINT_SHA256: "a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The engine's tests replay the specification's vectors, read from its published `main`:
      # a change there that this client does not meet turns this job red, which is the point.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: selvage-protocol/specification
          path: .ci/specification
          persist-credentials: false

      # The server the live test spawns, at its published `main`, built with the runner's own
      # stable Rust.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: selvage-protocol/reference_server
          path: .ci/reference_server
          persist-credentials: false

      # The VS Code client at its published `main`: the TypeScript engine the cross-implementation
      # test drives, the engine the other three clients share, so a change there that this one does
      # not meet turns this job red too; and the words, seats, names, initials and grant rules the
      # plugin's pins run through Node, with the vocabulary pin and manifest they read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: selvage-protocol/vscode_client
          path: .ci/vscode_client
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      # What the specification's peer runner seals and verifies frames with.
      - name: install the peer runner's packages
        run: pip install jsonschema==4.26.0 referencing==0.37.0 cryptography==50.0.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      # The yjs the differential test drives, at the versions the lockfile pins.
      - name: install the differential test's yjs
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: engine/src/test/node

      # The packages the TypeScript engine and the plugin's bridge import, at the versions the VS
      # Code client's lockfile pins.
      - name: install the VS Code client's packages
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .ci/vscode_client

      - name: install ktlint
        run: |
          curl -sSfL -o ktlint "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          echo "${KTLINT_SHA256}  ktlint" | sha256sum -c -
          chmod +x ktlint
          sudo mv ktlint /usr/local/bin/ktlint

      - name: lint
        run: |
          ktlint --relative "engine/**/*.kt" "plugin/**/*.kt" "*.kts" "engine/*.kts" "plugin/*.kts"
          shellcheck scripts/*.sh

      - name: the engine's suite
        run: ./gradlew --max-workers=4 --console=plain :engine:test
        env:
          SELVAGE_SPECIFICATION: ${{ github.workspace }}/.ci/specification

      - name: build selvaged
        run: cargo build --locked --release -p selvaged
        working-directory: .ci/reference_server
        env:
          CARGO_BUILD_JOBS: "4"

      - name: the engine against a real selvaged, alone and beside the TypeScript engine
        run: ./gradlew --max-workers=4 --console=plain :engine:liveTest
        env:
          SELVAGE_SPECIFICATION: ${{ github.workspace }}/.ci/specification
          SELVAGE_SELVAGED: ${{ github.workspace }}/.ci/reference_server/target/release/selvaged
          SELVAGE_VSCODE_CLIENT: ${{ github.workspace }}/.ci/vscode_client

      - name: the specification's peer runner, by its own tests
        run: scripts/run-peer-vectors.sh --self-test
        env:
          SELVAGE_SPECIFICATION: ${{ github.workspace }}/.ci/specification

      - name: the specification's peer corpus
        run: scripts/run-peer-vectors.sh
        env:
          SELVAGE_SPECIFICATION: ${{ github.workspace }}/.ci/specification

      - name: the peer corpus's mutation census
        run: scripts/run-peer-vectors.sh --mutation-census
        env:
          SELVAGE_SPECIFICATION: ${{ github.workspace }}/.ci/specification

      # The IntelliJ IDEA these run in and are verified against is downloaded into ~/.gradle, which
      # setup-gradle caches between runs.
      - name: the plugin's suite in a test IDE
        run: ./gradlew --max-workers=4 --console=plain :plugin:test
        env:
          SELVAGE_VSCODE_CLIENT: ${{ github.workspace }}/.ci/vscode_client

      - name: the plugin in a test IDE against a real selvaged
        run: ./gradlew --max-workers=4 --console=plain :plugin:test -Pselvage.live
        env:
          SELVAGE_VSCODE_CLIENT: ${{ github.workspace }}/.ci/vscode_client
          SELVAGE_SELVAGED: ${{ github.workspace }}/.ci/reference_server/target/release/selvaged

      - name: the Plugin Verifier against the targeted IDE
        run: ./gradlew --max-workers=4 --console=plain :plugin:verifyPlugin
